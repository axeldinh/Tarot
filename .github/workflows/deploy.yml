# Publishes the web build to GitHub Pages. Static hosting, no backend, no cost.
#
# Before the first run, set Settings -> Pages -> Source to "GitHub Actions".
# For Netlify or Cloudflare Pages instead, point them at this repo with build
# command `pnpm install && pnpm --filter @tarot/ui build` and publish directory
# `packages/ui/dist` — the build uses relative asset paths, so it works from a
# domain root or a subdirectory without being rebuilt.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tarot/ui build
        env:
          # The URL of the deployed packages/relay Worker (see its README), so
          # browsers can play a table together over the internet. Set this as
          # a repository variable once the relay has been deployed; table
          # play over the web stays off in a build with nothing set here —
          # the same as before the relay existed.
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
