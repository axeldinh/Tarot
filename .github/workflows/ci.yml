name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Headless simulation (10 000 hands per table size)
        run: pnpm --filter @tarot/engine simulate -- --games 10000
