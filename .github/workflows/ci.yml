name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage

      - name: Rules fuzzer (10 000 hands per table size, random legal play)
        run: pnpm --filter @tarot/engine simulate -- --games 10000

      - name: Bot-versus-bot simulation (10 000 hands per table size)
        run: pnpm --filter @tarot/bots simulate -- --games 10000 --level debutant

      # The searching levels are far slower per move, so they get a sanity run
      # rather than the full sweep. The 10 000-hand bar above is the real net.
      - name: Bot-versus-bot simulation, with search
        run: |
          pnpm --filter @tarot/bots simulate -- --games 100 --players 4 --level normal
          pnpm --filter @tarot/bots simulate -- --games 10 --players 4 --level confirme

      - name: Web build artefact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: packages/ui/dist
          if-no-files-found: error

  # The offline promise is easy to break by accident and invisible to a unit
  # test, so the built app is driven in a real browser with the network cut.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tarot/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @tarot/ui build
      - run: pnpm --filter @tarot/ui check:pwa

  # The APK could not be built in the container this was developed in, because
  # Google's Maven is unreachable from it. Here it can be, so here it is built.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list asks for `tools`, which Google
          # has removed from the SDK repository: sdkmanager reports "Failed to
          # find package 'tools'" and the step fails before anything is built.
          # The runner image already ships the platforms and build-tools, and
          # the Gradle plugin downloads whatever else it needs against the
          # licences this action accepts, so nothing is lost by not asking.
          packages: platform-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tarot/ui android:sync
      - run: pnpm --filter @tarot/ui check:android
      # This also compiles the Nearby plugin, which is the only native code in
      # the project and cannot be compiled where it was written.
      - name: Build the debug APK
        working-directory: packages/ui/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-debug-apk
          path: packages/ui/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
